{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Post</title>
    <link rel="stylesheet" href="{% static 'accounts/site.css' %}">
</head>
<body>
<main>
    <section class="card">
        {% include "accounts/partials/brand.html" %}
        <h1>Delete post?</h1>
        <p>{{ post.content }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn">Yes, delete</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </section>
</main>
</body>
</html>
